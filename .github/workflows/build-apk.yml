name: Build Nyxtra APKs

env:
  SINGBOX_VERSION: v1.14.2

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK (Modern & Legacy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Build libbox.aar from official SagerNet source
        run: |
          set -e
          git clone --depth 1 --branch "$SINGBOX_VERSION" https://github.com/SagerNet/sing-box.git "$RUNNER_TEMP/singbox-src"
          cd "$RUNNER_TEMP/singbox-src"
          export PATH="$PATH:$(go env GOPATH)/bin"
          go install github.com/sagernet/gomobile/cmd/gomobile github.com/sagernet/gomobile/cmd/gobind
          go run ./cmd/internal/build_libbox --target android --platform android/arm64,android/arm
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          rm -f "$GITHUB_WORKSPACE/app/libs/libbox-api.jar" "$GITHUB_WORKSPACE/app/libs/libbox.aar"
          cp libbox-legacy.aar "$GITHUB_WORKSPACE/app/libs/libbox.aar"
          ls -la "$GITHUB_WORKSPACE/app/libs/"

      - name: Build Modern & Legacy APKs
        run: ./gradlew assembleModernRelease assembleLegacyRelease --stacktrace

      - name: Upload Modern APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: nyxtra-modern-arm64
          path: app/build/outputs/apk/modern/release/*.apk
          retention-days: 14

      - name: Upload Legacy APK (universal)
        uses: actions/upload-artifact@v4
        with:
          name: nyxtra-legacy-universal
          path: app/build/outputs/apk/legacy/release/*.apk
          retention-days: 14

      - name: Upload All APKs
        uses: actions/upload-artifact@v4
        with:
          name: nyxtra-all-apks
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14
