name: Build Nyxtra APKs

env:
  SINGBOX_VERSION: v1.14.2

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK (Modern & Legacy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Setup Android NDK r28
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Build libbox.aar from official SagerNet source
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -e
          git clone --depth 1 --branch "$SINGBOX_VERSION" https://github.com/SagerNet/sing-box.git "$RUNNER_TEMP/singbox-src"
          cd "$RUNNER_TEMP/singbox-src"
          export PATH="$PATH:$(go env GOPATH)/bin"
          go install github.com/sagernet/gomobile/cmd/gomobile github.com/sagernet/gomobile/cmd/gobind
          go run ./cmd/internal/build_libbox --target android --platform android/arm64,android/arm
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          rm -f "$GITHUB_WORKSPACE/app/libs/libbox-api.jar" "$GITHUB_WORKSPACE/app/libs/libbox.aar"
          cp libbox-legacy.aar "$GITHUB_WORKSPACE/app/libs/libbox.aar"
          ls -la "$GITHUB_WORKSPACE/app/libs/"

      - name: Run Unit Tests
        run: ./gradlew :app:testModernDebugUnitTest --stacktrace

      - name: Validate generated config against real sing-box
        run: |
          set -e
          curl -sSL -o /tmp/sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION#v}-linux-amd64.tar.gz"
          tar xzf /tmp/sing-box.tar.gz -C /tmp
          python3 tools/validate_singbox_config.py \
            "/tmp/sing-box-${SINGBOX_VERSION#v}-linux-amd64/sing-box"

      - name: Build Modern & Legacy APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/nyxtra-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          ./gradlew assembleModernRelease assembleLegacyRelease --stacktrace

      - name: Upload Modern APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: nyxtra-modern-arm64
          path: app/build/outputs/apk/modern/release/*.apk
          retention-days: 14

      - name: Upload Legacy APK (universal)
        uses: actions/upload-artifact@v4
        with:
          name: nyxtra-legacy-universal
          path: app/build/outputs/apk/legacy/release/*.apk
          retention-days: 14

      - name: Upload All APKs
        uses: actions/upload-artifact@v4
        with:
          name: nyxtra-all-apks
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14
